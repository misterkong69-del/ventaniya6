<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Carga — Ventaniya 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b131a;
            color: #d8f8ff;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #111d28;
            border: 3px solid #008b8b;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
        }
        h1 {
            font-family: 'Special Elite', cursive;
            color: #ffffff;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0b131a;
            border: 2px solid #00ffff;
            border-radius: 4px;
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
            box-sizing: border-box;
        }
        .btn-cargar {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 14px;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0,255,255,0.4);
            margin-top: 10px;
        }
        .btn-cargar:hover {
            background-color: #ffffff;
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PANEL DE CARGA LOCAL</h1>
        
        <div class="form-group">
            <label for="imagenUrlInput">Nombre exacto del archivo PNG en tu repo:</label>
            <input type="text" id="imagenUrlInput" placeholder="Ej: aldea1.png">
        </div>

        <div class="form-group">
            <label for="tituloInput">Título de la Estampa:</label>
            <input type="text" id="tituloInput" placeholder="Ej: aldea1">
        </div>

        <div class="form-group">
            <label for="postaInput">Número de Posta:</label>
            <input type="text" id="postaInput" value="1002">
        </div>

        <div class="form-group">
            <label for="hashInput">Hash Base:</label>
            <input type="text" id="hashInput" value="MDW-2026">
        </div>

        <button class="btn-cargar" onclick="guardarLocalmente()">🚀 GUARDAR PIEZA</button>

        <div id="status"></div>
    </div>

    <script>
        function guardarLocalmente() {
            const archivo = document.getElementById('imagenUrlInput').value.trim();
            const titulo = document.getElementById('tituloInput').value.trim();
            const id_posta = document.getElementById('postaInput').value.trim();
            const hash_base = document.getElementById('hashInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!archivo || !titulo) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "⚠️ Completá el archivo y el título.";
                return;
            }

            try {
                // Recuperar piezas existentes del almacenamiento local
                let piezas = JSON.parse(localStorage.getItem('ventaniya_piezas') || '[]');
                
                // Generar un ID Hash único para la pieza
                const hashMatematico = Math.random().toString(36).substring(2, 10);

                piezas.push({
                    id: hashMatematico,
                    archivo: archivo,
                    titulo: titulo,
                    posta: id_posta,
                    hash_base: hash_base
                });

                localStorage.setItem('ventaniya_piezas', JSON.stringify(piezas));

                statusDiv.style.color = "#4ade80";
                statusDiv.innerText = "¡Guardado con éxito! Ya se ve en la vidriera.";
                
                document.getElementById('imagenUrlInput').value = '';
                document.getElementById('tituloInput').value = '';
            } catch (e) {
                console.error(e);
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "❌ Error al guardar localmente.";
            }
        }
    </script>
</body>
</html>
