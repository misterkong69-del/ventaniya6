<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidriera — Ventaniya 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b131a;
            color: #d8f8ff;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #00ffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        header h1 {
            font-family: 'Special Elite', cursive;
            font-size: 1.8rem;
            margin: 8px 0 0 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }
        .vidriera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-estampiya {
            background-color: #111d28;
            border: 3px solid #008b8b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .estampiya-frame {
            background: #0b131a;
            padding: 8px;
            border: 2px solid #00ffff;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .estampiya-frame img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
        }
        .info-estampa {
            font-size: 0.8rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #a5f3fc;
        }
        .info-estampa h3 {
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .btn-descarga-mdw {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 10px;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            transition: background 0.2s;
        }
        .btn-descarga-mdw:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA 6</h1>
        <p style="font-size: 0.85rem; color: #67e8f9; margin-top: 5px;">Archivo visual y sello alfanumérico de descarga.</p>
    </header>

    <main id="vidriera-container" class="vidriera-grid">
        <!-- Renderizado dinámico local -->
    </main>

    <canvas id="canvas-sello" style="display:none;"></canvas>

    <script>
        // Generador de hash alfanumérico prolijo (letras y números mezclados)
        function generarHashAlfanumerico() {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let hash = "v6-";
            for (let i = 0; i < 6; i++) {
                hash += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return hash;
        }

        const piezasDefault = [
            { id: generarHashAlfanumerico(), titulo: "aldea1", archivo: "aldea1.png", posta: "1002" },
            { id: "v6-k9x2m4", titulo: "estacion", archivo: "estacion.png", posta: "1002" },
            { id: "v6-7p4q9w", titulo: "querandi", archivo: "querandi.png", posta: "1002" }
        ];

        function cargarVidriera() {
            const contenedor = document.getElementById('vidriera-container');
            contenedor.innerHTML = "";

            let piezasGuardadas = JSON.parse(localStorage.getItem('ventaniya_piezas') || 'null');
            if (!piezasGuardadas) {
                piezasGuardadas = piezasDefault;
                localStorage.setItem('ventaniya_piezas', JSON.stringify(piezasDefault));
            } else {
                // Asegurar que cada pieza guardada tenga un ID alfanumérico válido
                piezasGuardadas = piezasGuardadas.map(p => ({
                    ...p,
                    id: p.id && p.id.includes('-') ? p.id : generarHashAlfanumerico()
                }));
            }

            if (piezasGuardadas.length === 0) {
                contenedor.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #00ffff; padding: 40px;">No hay piezas cargadas.</div>`;
                return;
            }

            piezasGuardadas.forEach(item => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-estampiya';
                
                tarjeta.innerHTML = `
                    <div>
                        <div class="estampiya-frame">
                            <img src="${item.archivo}" alt="${item.titulo}" crossorigin="anonymous">
                        </div>
                        <div class="info-estampa">
                            <h3>${item.titulo}</h3>
                            <div><strong>Posta:</strong> ${item.posta}</div>
                            <div><strong>ID Hash:</strong> ${item.id}</div>
                        </div>
                    </div>
                    <button class="btn-descarga-mdw">📥 DESCARGAR CON SELLO ALFANUMÉRICO</button>
                `;

                const btnDescarga = tarjeta.querySelector('.btn-descarga-mdw');
                btnDescarga.addEventListener('click', () => {
                    descargarConSelloRedondo(item.archivo, item.titulo, item.posta, item.id);
                });

                contenedor.appendChild(tarjeta);
            });
        }

        function descargarConSelloRedondo(urlImagen, titulo, posta, hashMatematico) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = urlImagen;

            img.onload = () => {
                const canvas = document.getElementById('canvas-sello');
                const ctx = canvas.getContext('2d');

                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;

                // 1. Dibujar imagen original intacta
                ctx.drawImage(img, 0, 0);

                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const tiempoStr = `${horas}:${minutos}:${segundos}`;

                // 2. Coordenadas y tamaño del sello redondo (abajo a la derecha)
                const radioSello = Math.max(75, Math.floor(canvas.width * 0.13));
                const centroX = canvas.width - radioSello - 45;
                const centroY = canvas.height - radioSello - 45;

                ctx.save();

                // Sombra de los trazos del sello
                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Círculo exterior principal (Cian translúcido)
                ctx.beginPath();
                ctx.arc(centroX, centroY, radioSello, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(3.5, radioSello * 0.07);
                ctx.strokeStyle = "rgba(0, 255, 255, 0.85)";
                ctx.stroke();

                // Círculo interior concéntrico
                ctx.beginPath();
                ctx.arc(centroX, centroY, radioSello - 7, 0, Math.PI * 2);
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = "rgba(0, 139, 139, 0.85)";
                ctx.stroke();

                ctx.restore();

                // 3. Función auxiliar para texto nítido con sombra y trazo
                function dibujarTextosello(texto, posX, posY, fontSize, colorTexto, esNegrita = false) {
                    ctx.save();
                    ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                    ctx.shadowBlur = 6;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.9)";
                    
                    ctx.font = `${esNegrita ? 'bold' : ''} ${fontSize}px 'Courier New', monospace`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    ctx.strokeText(texto, posX, posY);
                    ctx.fillStyle = colorTexto;
                    ctx.fillText(texto, posX, posY);
                    ctx.restore();
                }

                const fontGrande = Math.max(11, Math.floor(radioSello * 0.22));
                const fontChico = Math.max(9, Math.floor(radioSello * 0.17));

                // 4. Escribir datos dentro del sello (incluyendo el hash alfanumérico limpio)
                dibujarTextosello("VENTANIYA", centroX, centroY - radioSello * 0.38, fontGrande, "#ffffff", true);
                dibujarTextosello(`POSTA ${posta}`, centroX, centroY - radioSello * 0.08, Math.floor(fontGrande * 1.15), "#00ffff", true);
                dibujarTextosello(`TIME: ${tiempoStr}`, centroX, centroY + radioSello * 0.20, fontChico, "#d8f8ff", false);
                dibujarTextosello(`HASH: ${hashMatematico}`, centroX, centroY + radioSello * 0.48, Math.floor(fontChico * 0.82), "#a5f3fc", true);

                // 5. Generar descarga automática
                const enlaceFinal = document.createElement('a');
                enlaceFinal.download = `${titulo.toLowerCase().replace(/\s+/g, '_')}_ventaniya1002.jpg`;
                enlaceFinal.href = canvas.toDataURL('image/jpeg', 0.95);
                enlaceFinal.click();
            };

            img.onerror = () => {
                alert("No se pudo cargar la imagen para estampar. Comprobá que el archivo exista.");
            };
        }

        window.onload = cargarVidriera;
    </script>
</body>
</html>
