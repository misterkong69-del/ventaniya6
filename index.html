<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidriera — Ventaniya 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b131a;
            color: #d8f8ff;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #00ffff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        header h1 {
            font-family: 'Special Elite', cursive;
            font-size: 1.8rem;
            margin: 8px 0 0 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }
        .vidriera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-estampiya {
            background-color: #111d28;
            border: 3px solid #008b8b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .estampiya-frame {
            background: #0b131a;
            padding: 8px;
            border: 2px solid #00ffff;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .estampiya-frame img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
        }
        .info-estampa {
            font-size: 0.8rem;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #a5f3fc;
        }
        .info-estampa h3 {
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .btn-descarga-mdw {
            background-color: #00ffff;
            color: #070c10;
            border: none;
            padding: 10px;
            font-family: 'Special Elite', cursive;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        .btn-descarga-mdw:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>VENTANIYA 6</h1>
        <p style="font-size: 0.85rem; color: #67e8f9; margin-top: 5px;">Archivo visual y sello atómico de descarga.</p>
    </header>

    <main id="vidriera-container" class="vidriera-grid">
        <div style="grid-column: 1 / -1; text-align: center; color: #00ffff; padding: 40px;">
            Cargando archivo...
        </div>
    </main>

    <!-- Canvas oculto para procesar el sello -->
    <canvas id="canvas-sello" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnLtvnb5IW1X-HbuC3uC0Dcf6BaojmndE",
            authDomain: "mardelasmaravillas1.firebaseapp.com",
            projectId: "mardelasmaravillas1",
            storageBucket: "mardelasmaravillas1.firebasestorage.app",
            messagingSenderId: "1041475872464",
            appId: "1:1041475872464:web:87d00298ea219bdb4aa0d5",
            measurementId: "G-F87RCG37BW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function limpiarRutaImagen(url) {
            if (!url) return '';
            if (url.includes('github.com') || url.includes('raw.githubusercontent.com')) {
                const partes = url.split('/');
                return partes[partes.length - 1].split('?')[0];
            }
            return url;
        }

        async function cargarVidrieraCompleta() {
            const contenedor = document.getElementById('vidriera-container');
            try {
                const querySnapshot = await getDocs(collection(db, "estampiyas_mdw"));
                
                contenedor.innerHTML = "";

                if (querySnapshot.empty) {
                    contenedor.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #00ffff; padding: 40px;">No hay registros activos.</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let rutaCruda = data.imagen_url || data.stamp_url || '';
                    let imagenSrc = limpiarRutaImagen(rutaCruda);
                    
                    // Ocultamos registros fantasmas que no tengan imagen real o archivo local asociado
                    if (!imagenSrc) return;

                    const titulo = data.titulo || 'Pieza';
                    const posta = data.id_posta || '1002';
                    // Usamos el ID matemático real del documento de Firestore como hash puro
                    const hashMatematico = docSnap.id;
                    
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-estampiya';
                    
                    tarjeta.innerHTML = `
                        <div>
                            <div class="estampiya-frame">
                                <img src="${imagenSrc}" alt="${titulo}" crossorigin="anonymous">
                            </div>
                            <div class="info-estampa">
                                <h3>${titulo}</h3>
                                <div><strong>Posta:</strong> ${posta}</div>
                                <div><strong>ID Hash:</strong> ${hashMatematico}</div>
                            </div>
                        </div>
                        <button class="btn-descarga-mdw">📥 DESCARGAR CON LÍNEA ATÓMICA</button>
                    `;

                    const btnDescarga = tarjeta.querySelector('.btn-descarga-mdw');
                    btnDescarga.addEventListener('click', () => {
                        descargarConSelloAtomico(imagenSrc, titulo, posta, hashMatematico);
                    });

                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #ff6b6b;">Error al sincronizar el archivo.</div>`;
            }
        }

        function descargarConSelloAtomico(urlImagen, titulo, posta, hashMatematico) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = urlImagen;

            img.onload = () => {
                const canvas = document.getElementById('canvas-sello');
                const ctx = canvas.getContext('2d');

                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;

                // Dibuja la imagen original limpia
                ctx.drawImage(img, 0, 0);

                // Obtener hora exacta en formato 24hs con milisegundos
                const ahora = new Date();
                const horas = String(ahora.getHours()).padStart(2, '0');
                const minutos = String(ahora.getMinutes()).padStart(2, '0');
                const segundos = String(ahora.getSeconds()).padStart(2, '0');
                const milisegundos = String(ahora.getMilliseconds()).padStart(3, '0');
                const tiempoAtomico = `${horas}:${minutos}:${segundos}.${milisegundos}`;

                // Configuración de la línea de tiempo atómica grande e impecable (sin recuadro cuadrado)
                const fontSize = Math.max(16, Math.floor(canvas.width * 0.028));
                ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                
                const textoLinea = `[ ventaniya 1002 ]  |  TIME: ${tiempoAtomico}  |  HASH: ${hashMatematico}  |  POSTA: ${posta}`;
                
                const paddingX = 30;
                const paddingY = 40;
                const x = paddingX;
                const y = canvas.height - paddingY;

                // Sombra sutil para lectura perfecta sobre cualquier fondo de imagen
                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                ctx.shadowBlur = 6;
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
                ctx.strokeText(textoLinea, x, y);

                // Texto principal en cian brillante atómico
                ctx.fillStyle = "#00ffff";
                ctx.shadowBlur = 0;
                ctx.fillText(textoLinea, x, y);

                // Descarga automática
                const enlaceFinal = document.createElement('a');
                enlaceFinal.download = `${titulo.toLowerCase().replace(/\s+/g, '_')}_ventaniya1002.jpg`;
                enlaceFinal.href = canvas.toDataURL('image/jpeg', 0.95);
                enlaceFinal.click();
            };

            img.onerror = () => {
                alert("No se pudo cargar el archivo de imagen local.");
            };
        }

        window.onload = cargarVidrieraCompleta;
    </script>
</body>
</html>
